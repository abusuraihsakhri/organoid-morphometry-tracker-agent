[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-morphometry-tracker-agent"
version = "2.0.0"
description = "Deterministic screening of user-supplied numeric organoid metrics and status flags"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["agents", "organoid_vision"]
py-modules = ["cli", "enrichment", "simulator", "organoid_vision_app"]

[tool.setuptools.package-data]
agents = ["static/*.html"]

[project.scripts]
organoid-morphometry-tracker-engine = "organoid_vision.cli:main"
organoid-morphometry-tracker-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/organoid-morphometry-tracker-agent"
Repository = "https://github.com/abusuraihsakhri/organoid-morphometry-tracker-agent.git"
