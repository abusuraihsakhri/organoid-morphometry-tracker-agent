services:
  organoid-morphometry-tracker-engine:
    build: .
    container_name: organoid-morphometry-tracker-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY to a unique random value}
      - AUDIT_API_TOKEN=${AUDIT_API_TOKEN:?Set AUDIT_API_TOKEN to a unique random bearer token}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
