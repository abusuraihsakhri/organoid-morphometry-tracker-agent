name: Organoid Morphometry Tracker Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: "ci-only-test-secret-not-for-production-32chars"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[test]'
        python -m pip check

    - name: Check installable wheel
      run: python -m pip wheel --no-deps --wheel-dir /tmp/organoid-wheels .

    - name: Check Python syntax
      run: python -m compileall -q agents organoid_vision cli.py enrichment.py simulator.py

    - name: Check inline browser JavaScript
      run: |
        python - <<'PY'
        import re
        from pathlib import Path
        content = Path("web/index.html").read_text(encoding="utf-8")
        script = re.search(r"<script>(.*?)</script>", content, re.DOTALL)
        if not script:
            raise SystemExit("Inline script not found")
        Path("/tmp/organoid-app.js").write_text(script.group(1), encoding="utf-8")
        PY
        node --check /tmp/organoid-app.js

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: HMAC and identifier-pattern smoke check
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        PHIGuard.assert_no_phi('SPECIMEN-001')
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
